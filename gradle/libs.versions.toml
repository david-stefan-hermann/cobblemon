[versions]
# Kotlin
# port/26.2: kotlin bumped to match fabric-language-kotlin 1.13.13+kotlin.2.4.10 (confirmed working on 26.2)
kotlin = "2.4.10"

# Plugins
licenser = "0.6.1"
shadow = "9.2.2"
blossom = "2.1.0"
idea-ext = "1.1.7"
versioning = "3.1.0"

# Minecraft Development
# PT006 (port/26.1.x): Loom 1.11.458과 architectury-plugin 3.4은 MC 26.1.x unobfuscated 처리 미지원.
# `officialMojangMappings()` 호출이 piston-meta v26.1.2.json에 client_mappings/server_mappings artifact가 없어 실패(F004).
# MC 26.1.2는 unobfuscated 릴리스(downloads에 client/server jar만 존재 — piston-meta.mojang.com/v1/packages/.../26.1.2.json 검증)이므로
# Loom 신버전(1.14.x)이 unobfuscated 모드를 인지하도록 bump. fabric-api 26.1.2가 fabric-loom 1.15.5를 사용하는 것과 동일 세대.
# PT010: 1.14.473에서 F005 재현 → 1.14-SNAPSHOT 시도. 결과: 1.14.473 동일 코드(F005 CONFIRMED iter#77).
# PT011: architectury-loom 드롭, fabric-loom 1.15.5 직접 사용(fabric-example-mod 26.1.2에서 검증된 unobfuscated MC 자동 처리).
# architectury-plugin도 함께 드롭 — :neoforge 타깃 제거 동반.
fabric-loom = "1.17.20"
moddev = "1.0.11"

# Common
molang = "1.1.20"
jei-api = "30.32.0.209"

# Graal
# port/26.2: GraalVM 22.3 predates Java 25 and its Truffle calls sun.misc.Unsafe.ensureClassInitialized,
# which no longer exists - the showdown thread died on it and the server hung waiting for showdown.
graal = "25.0.0"
icu4j = "78.3"
regex = "22.3.0"
truffle = "22.3.0"

# Fabric
# port/26.2: fabric-* bumped to confirmed-working 26.2 versions
fabric-loader = "0.19.3"
fabric-api = "0.158.0+26.2"
fabric-kotlin = "1.13.13+kotlin.2.4.10"
fabric-permissions-api = "0.3.1"
lambDynamicLights = "4.12.3+26.2"
debugutils-fabric = "1.21.1-1.0.9-fabric"
mod-menu = "20.0.1"
c2me-fabric = "0.3.0+alpha.0.320+1.21.1"

# NeoForge
neoforge = "21.1.182"
neo-kotlin-for-forge = "5.10.0"
debugutils-forge = "1.21.1-1.0.9-neoforge"
c2me-neoforge = "0.3.0+alpha.0.73+1.21.1"

# Data Storage
mongo = "4.10.2"

# Testing
junit = "5.11.4"
mockito = "5.14.2"
mockk = "1.13.14"
classgraph = "4.8.179"

[libraries]
# General Buildscript Plugins
kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
# PT011: archi-loom → fabric-loom 1.15.5 (plugin marker artifact coordinate)
fabric-loom = { group = "net.fabricmc", name = "fabric-loom", version.ref = "fabric-loom" }
# neoforge-moddev/architectury는 :neoforge 타깃 제거에 따라 더 이상 사용되지 않으나 lib 항목 자체는 유지(다른 plugin 적용 안 함).
neoforge-moddev = { group = "net.neoforged", name = "moddev-gradle", version.ref = "moddev" }
shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
blossom = { group = "net.kyori", name = "blossom", version.ref = "blossom" }
ideaExt = { group = "org.jetbrains.gradle.plugin.idea-ext", name = "org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "idea-ext"}
licenser = { group = "gradle.plugin.org.cadixdev.gradle", name = "licenser", version.ref = "licenser" }
versioning = { group = "net.nemerosa.versioning", name = "net.nemerosa.versioning.gradle.plugin", version.ref = "versioning" }

# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

# Common
jei-api = { group = "mezz.jei", name = "jei-26.2-common-api", version.ref = "jei-api"}
molang = { group = "local.com.bedrockk", name = "molang", version.ref = "molang" }

# Graal
graal-core = { group = "org.graalvm.polyglot", name = "polyglot", version.ref = "graal" }
# The js-community/js aggregates are pom-only, and loom opens every runtime dependency as a zip
# looking for a fabric.mod.json - handing it a .pom fails with 'Provider "jar" not found'. So the real
# jars are named directly.
graal-js = { group = "org.graalvm.js", name = "js-language", version.ref = "graal" }
graal-truffle = { group = "org.graalvm.truffle", name = "truffle-runtime", version.ref = "graal" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }
fabric-permissions = { group = "me.lucko", name = "fabric-permissions-api", version.ref = "fabric-permissions-api" }
adorn-fabric = { group = "maven.modrinth", name = "adorn", version = "6.0.0-neoforge"}
lambDynamicLights = { group = "dev.lambdaurora.lambdynamiclights", name = "lambdynamiclights-api", version.ref = "lambDynamicLights"}
jei-fabric = { group = "mezz.jei", name = "jei-26.2-fabric", version.ref = "jei-api"}
fabric-debugutils = { group = "maven.modrinth", name = "debugutils", version.ref = "debugutils-fabric"}
mod-menu = { group = "com.terraformersmc", name = "modmenu", version.ref = "mod-menu" }
c2me-fabric = { group = "maven.modrinth", name = "c2me-fabric", version.ref = "c2me-fabric" }

# NeoForge
neoforge-api = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
neo-kotlin-forge = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "neo-kotlin-for-forge" }
neoforge-debugutils = { group = "maven.modrinth", name = "debugutils", version.ref = "debugutils-forge"}
jei-neoforge = { group = "mezz.jei", name = "jei-26.2-neoforge", version.ref = "jei-api"}
c2me-neoforge = { group = "maven.modrinth", name = "c2me-neoforge", version.ref = "c2me-neoforge" }

# Data Storage
mongo-driver-core = { group = "org.mongodb", name = "mongodb-driver-core", version.ref = "mongo" }
mongo-driver-sync = { group = "org.mongodb", name = "mongodb-driver-sync", version.ref = "mongo" }

# Testing
junit-fabric = { group = "net.fabricmc", name = "fabric-loader-junit", version.ref = "fabric-loader" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mock-kotlin = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
classgraph = { group = "io.github.classgraph", name = "classgraph", version.ref = "classgraph" }

[bundles]
kotlin = [ "kotlin-stdlib", "kotlin-reflect" ]
fabric = [ "fabric-kotlin", "fabric-permissions" ]
common-integrations-compileOnly = [ "adorn-fabric", "jei-api" ]
fabric-integrations-implementation = [ "mod-menu" ]
fabric-integrations-runtimeOnly = [ "jei-fabric", "c2me-fabric" ]
neoforge-integrations-runtimeOnly = [ "jei-neoforge", "c2me-neoforge" ]
mongo = [ "mongo-driver-core", "mongo-driver-sync" ]
unitTesting = [ "junit-fabric", "junit-params", "mockito-core", "mock-kotlin", "classgraph" ]

graal = [ "graal-core", "graal-js", "graal-truffle" ]
