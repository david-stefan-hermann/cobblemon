# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=false
org.gradle.parallel=true

group=com.cobblemon.mod

# API
# PT001 (port/26.1.x): mc_version 1.21.1 → 26.1.2 (V08 Mojang unobfuscated, V28/V29 VulkanMod+Beryl 26.1.2 jar 페어 존재)
# parchment_version은 일단 유지 — 26.1 unobfuscated에서 parchment 비호환이면 B001 빌드 실패가 reveal하고 PT002에서 처리
mc_version = 26.1.2
parchment_version = 2024.07.28@zip
# Used in mod files
# PT003 (port/26.1.x): java_version 21 → 25 (F001 — Loom 1.11.458 toolchain 요구)
java_version = 25

mod_id=cobblemon
mod_version=1.8.0
snapshot=true

fabric.loom.multiProjectOptimisation=false

# PT019 (port/26.1.x): Kotlin 2.3.21 JVM_25 미지원, Java 25는 MC 26.1.x 토큰체인 강제.
# Java compileJava=25 vs compileKotlin=24 inconsistency를 strict error→warning으로 다운그레이드.
kotlin.jvm.target.validation.mode=warning